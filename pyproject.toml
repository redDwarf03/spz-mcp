[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spz-mcp"
version = "0.1.0"
description = "MCP server exposing a running StableProjectorz instance to an LLM agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "redDwarf03" }]
keywords = ["mcp", "stableprojectorz", "stable-diffusion", "3d", "texturing", "unity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/redDwarf03/spz-mcp"
"Agent bridge" = "https://github.com/redDwarf03/StableProjectorz/tree/feat/agent-bridge/Assets/_gm/Features/AgentBridge"

[project.scripts]
spz-mcp = "spz_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-timeout>=2.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/spz_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Every test here talks to a local socket and should finish in milliseconds.
# A hang is a bug, so fail on it instead of blocking the suite forever.
timeout = 30
